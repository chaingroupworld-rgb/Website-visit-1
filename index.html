<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Tier - Background Music</title>
    <style>
        :root {
            --bg-dark: #0b1e3b;
            --silver-bright: #ecf0f1;
            --silver-deep: #7f8c8d;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            overflow: hidden;
        }

        .phone-frame {
            width: 380px; height: 95vh;
            border: 6px solid #bdc3c7;
            border-radius: 40px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle, #1a3a5f 0%, #0a192f 100%);
            text-align: center;
            position: relative;
        }

        .logo {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 4px solid var(--silver-bright);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        h2 { color: var(--silver-bright); margin: 10px 0; }
        p { opacity: 0.7; font-size: 14px; margin-bottom: 30px; }

        .play-btn {
            background: linear-gradient(to bottom, #ffffff, #bdc3c7);
            color: #0b1e3b;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        /* মিউজিক বাজলে বাটনের এনিমেশন */
        .playing {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 255, 255, 0.6); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- অডিও এলিমেন্ট -->
    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/ohhdm6.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="phone-frame">
        <img src="https://i.ibb.co.com/ns31pFXv/IMG-20251220-223045.jpg" class="logo">
        <h2>SILVER QUIZ</h2>
        <p>Music is ready. Tap to start!</p>
        
        <button id="musicControl" class="play-btn" onclick="toggleMusic()">Start Music</button>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicControl');
        let isPlaying = false;

        function toggleMusic() {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    btn.innerText = "Pause Music";
                    btn.classList.add('playing');
                }).catch(error => {
                    console.log("Playback failed:", error);
                });
            } else {
                music.pause();
                isPlaying = false;
                btn.innerText = "Resume Music";
                btn.classList.remove('playing');
            }
        }

        // ইউজার স্ক্রিনে যেকোনো জায়গায় ক্লিক করলে মিউজিক শুরু হওয়ার চেষ্টা করবে (যদি আগে না শুরু হয়)
        document.body.addEventListener('click', function() {
            if (!isPlaying) {
                toggleMusic();
            }
        }, { once: true }); // একবার ক্লিক হলেই হবে
    </script>

</body>
</html>
